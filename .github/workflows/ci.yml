name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 固定版本：ubuntu-latest 已是 26.04，setup-python 在它上面没有 3.8 / 3.9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 3.8 是 README 写明的最低版本，3.13 与服务器（Debian 13）一致
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.8
            3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (Python 3.13)
        run: python3.13 tests/run.py

      # 素材管理器的测试要生成缩略图，需要 Pillow（唯一被接受的第三方依赖）
      - name: Install Pillow for manager tests
        run: python3.13 -m pip install --quiet pillow

      - name: Manager tests (HTTP API)
        run: python3.13 tests/test_manager.py

      - name: Build with minimum Python (3.8)
        run: |
          # prompts 站的数据源（data/prompts_*.json、data/gallery_*.js，约 220 MB）
          # 不入库、可由 import_youmind.py 重拉，干净检出上构建它必然失败，所以跳过。
          # 其余五站照常构建并逐文件比对，闸门不变。
          python3.8 tools/build.py --skip prompts
          git diff --exit-code -- hub sites \
            || { echo "::error::构建产物与仓库不一致，请运行 python tools/build.py 并提交"; exit 1; }

      # 图片不进仓库，CI 拿不到图片，所以只检查发布脚本本身能跑通、不带图
      - name: Release without images
        run: python3.13 tools/release.py --no-images --out /tmp/dist-ci

      - name: update.py check on a clean checkout
        run: python3.13 tools/update.py --check --no-fetch --ref HEAD
